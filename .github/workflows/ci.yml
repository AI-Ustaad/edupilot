name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm ci
      - name: Install Firebase Tools
        run: npm install -g firebase-tools
      - name: Start Emulator
        run: |
          firebase emulators:start --only firestore --project demo-test &
          sleep 5
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
