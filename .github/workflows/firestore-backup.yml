name: Firestore Daily Backup

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Run Firestore Export
        run: |-
          BUCKET_NAME="edupilot-backups"
          EXPORT_PATH="backups/$(date +'%Y-%m-%d_%H-%M-%S')"
          gcloud config set project ${{ secrets.GCP_PROJECT_ID }}
          gcloud firestore export gs://${BUCKET_NAME}/${EXPORT_PATH} --async
          echo "Export started: gs://${BUCKET_NAME}/${EXPORT_PATH}"

      - name: List recent backups
        run: gcloud firestore operations list --limit=5
